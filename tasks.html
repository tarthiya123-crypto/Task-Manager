<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Tasks | Redline</title><link rel="stylesheet" href="proj.css"></head>
<body data-page="tasks"><div class="app-shell"><header class="topbar"><a class="brand" href="proj.html"><span class="brand-mark">R</span><span>REDLINE</span></a><nav class="main-nav" aria-label="Primary navigation"><a data-nav="dashboard" href="proj.html">Dashboard</a><a data-nav="tasks" href="tasks.html">Tasks</a><a data-nav="timer" href="timer.html">Timer</a><a data-nav="insights" href="insights.html">Insights</a><a data-nav="settings" href="settings.html">Settings</a></nav><span class="today-label" id="today-label"></span></header>
<main><section class="page-heading"><div><p class="eyebrow">WORK QUEUE</p><h1>All tasks</h1><p class="intro-copy">Capture the work, set the priority, and keep the next action obvious.</p></div><span class="page-count" id="visible-count">0 tasks</span></section><div class="task-layout"><section class="panel task-panel"><div class="panel-heading"><h2>Task list</h2><button class="text-button" id="clear-completed" type="button" disabled>Clear completed</button></div><div class="task-controls"><label class="search-box"><span aria-hidden="true">/</span><span class="visually-hidden">Search tasks</span><input id="search-input" type="search" placeholder="Search tasks..." autocomplete="off"></label><select class="select-control" id="sort-select" aria-label="Sort tasks"><option value="none">Newest first</option><option value="high">High priority</option><option value="low">Low priority</option><option value="due">Due date</option></select></div><div class="filter-tabs"><button class="filter-tab is-active" data-filter="all" type="button">All</button><button class="filter-tab" data-filter="pending" type="button">In progress</button><button class="filter-tab" data-filter="completed" type="button">Completed</button></div><div class="task-list" id="task-list" aria-live="polite"></div></section><aside class="task-sidebar"><section class="panel form-panel" id="add-task"><div class="panel-heading"><div><p class="eyebrow" id="form-eyebrow">NEW ENTRY</p><h2 id="form-heading">Add a task</h2></div><span class="form-icon">+</span></div><form id="task-form"><label class="field-label" for="task-title">Task name</label><input class="form-control" id="task-title" name="title" maxlength="120" placeholder="What needs to get done?" required><div class="form-row"><div><label class="field-label" for="task-category">Category</label><select class="form-control" id="task-category" name="category"><option>Work</option><option>Study</option><option>Personal</option><option>Other</option></select></div><div><label class="field-label" for="task-priority">Priority</label><select class="form-control" id="task-priority" name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><label class="field-label" for="task-due-date">Due date <span class="optional-label">Optional</span></label><input class="form-control" id="task-due-date" name="dueDate" type="date"><div class="form-row"><div><label class="field-label" for="task-start-time">Start time <span class="optional-label">Optional</span></label><input class="form-control" id="task-start-time" name="startTime" type="time"></div><div><label class="field-label" for="task-end-time">End time <span class="optional-label">Optional</span></label><input class="form-control" id="task-end-time" name="endTime" type="time"></div></div><p class="form-hint">Add only a start time when the finish time is unknown.</p><div class="form-actions"><button class="primary-button" id="submit-task" type="submit">+ Add task</button><button class="cancel-button" id="cancel-edit" type="button" hidden>Cancel</button></div></form></section></aside></div><p class="status-message" id="status-message" role="status" aria-live="polite"></p></main><footer class="footer">REDLINE / Tasks stay in this browser.</footer></div><script src="proj.js" defer></script></body></html>
